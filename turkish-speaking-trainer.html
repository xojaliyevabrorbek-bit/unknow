<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Türkçe Konuşma Antrenörü - Speaking Trainer</title>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            color: #1a1a1a;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
        }

        /* Header */
        header {
            background: rgba(255, 255, 255, 0.95);
            padding: 20px;
            border-radius: 15px;
            margin-bottom: 30px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .header-title {
            font-size: 28px;
            font-weight: bold;
            color: #667eea;
        }

        .header-subtitle {
            font-size: 14px;
            color: #666;
            margin-top: 5px;
        }

        .level-badge {
            display: inline-block;
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
            padding: 8px 16px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: bold;
            text-transform: uppercase;
        }

        /* Main Content */
        .main-content {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-bottom: 30px;
        }

        .card {
            background: white;
            border-radius: 15px;
            padding: 30px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
            transition: all 0.3s ease;
        }

        .card:hover {
            transform: translateY(-5px);
            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.15);
        }

        .card h2 {
            color: #667eea;
            margin-bottom: 20px;
            font-size: 22px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .card-icon {
            font-size: 28px;
        }

        /* Level Selector */
        .level-selector {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }

        .level-btn {
            padding: 10px 18px;
            border: 2px solid #e0e0e0;
            background: white;
            border-radius: 25px;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.3s ease;
            color: #666;
        }

        .level-btn:hover {
            border-color: #667eea;
            color: #667eea;
        }

        .level-btn.active {
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
            border-color: transparent;
        }

        /* Topic Selector */
        .topic-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            margin-bottom: 20px;
        }

        .topic-card {
            padding: 15px;
            background: #f5f5f5;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.3s ease;
            border: 2px solid transparent;
            text-align: center;
            font-weight: 500;
        }

        .topic-card:hover {
            background: #efefef;
            transform: scale(1.02);
        }

        .topic-card.selected {
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
            border-color: white;
        }

        /* Chat Area */
        .chat-container {
            background: white;
            border-radius: 15px;
            padding: 25px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
            display: flex;
            flex-direction: column;
            height: 500px;
            margin-bottom: 20px;
        }

        .chat-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            padding-bottom: 15px;
            border-bottom: 2px solid #f0f0f0;
        }

        .chat-header h3 {
            color: #667eea;
            font-size: 18px;
        }

        .chat-title {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .messages {
            flex: 1;
            overflow-y: auto;
            margin-bottom: 20px;
            padding-right: 10px;
        }

        .messages::-webkit-scrollbar {
            width: 6px;
        }

        .messages::-webkit-scrollbar-track {
            background: #f1f1f1;
            border-radius: 10px;
        }

        .messages::-webkit-scrollbar-thumb {
            background: #667eea;
            border-radius: 10px;
        }

        .message {
            margin-bottom: 15px;
            padding: 12px 15px;
            border-radius: 12px;
            animation: slideIn 0.3s ease;
            max-width: 85%;
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .message.user {
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
            align-self: flex-end;
            margin-left: auto;
            text-align: right;
        }

        .message.assistant {
            background: #f0f0f0;
            color: #1a1a1a;
            align-self: flex-start;
        }

        .message-meta {
            font-size: 12px;
            opacity: 0.7;
            margin-top: 5px;
        }

        .feedback {
            background: #fff9e6;
            padding: 10px 12px;
            border-radius: 8px;
            font-size: 12px;
            margin-top: 8px;
            border-left: 3px solid #ffc107;
        }

        /* Input Area */
        .input-area {
            display: flex;
            gap: 10px;
        }

        .input-field {
            flex: 1;
            padding: 12px 15px;
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            font-size: 14px;
            transition: all 0.3s ease;
        }

        .input-field:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }

        .send-btn {
            padding: 12px 25px;
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.3s ease;
        }

        .send-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }

        .send-btn:active {
            transform: translateY(0);
        }

        /* Feedback Section */
        .feedback-section {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }

        .feedback-card {
            background: white;
            border-radius: 15px;
            padding: 20px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
        }

        .feedback-card h3 {
            color: #667eea;
            margin-bottom: 15px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .error-item {
            background: #ffebee;
            padding: 10px 12px;
            border-radius: 8px;
            margin-bottom: 8px;
            border-left: 3px solid #f44336;
            font-size: 13px;
            line-height: 1.4;
        }

        .tip-item {
            background: #e8f5e9;
            padding: 10px 12px;
            border-radius: 8px;
            margin-bottom: 8px;
            border-left: 3px solid #4caf50;
            font-size: 13px;
            line-height: 1.4;
        }

        .empty-state {
            text-align: center;
            color: #999;
            padding: 20px;
        }

        .new-chat-btn {
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
            border: none;
            padding: 12px 25px;
            border-radius: 10px;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.3s ease;
            width: 100%;
            margin-top: 10px;
        }

        .new-chat-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }

        /* Responsive */
        @media (max-width: 768px) {
            .main-content {
                grid-template-columns: 1fr;
            }

            .feedback-section {
                grid-template-columns: 1fr;
            }

            header {
                flex-direction: column;
                text-align: center;
                gap: 10px;
            }

            .topic-grid {
                grid-template-columns: 1fr;
            }

            .message {
                max-width: 95%;
            }

            .chat-container {
                height: 400px;
            }
        }

        /* Loading animation */
        .typing-indicator {
            display: flex;
            gap: 4px;
            align-items: center;
        }

        .typing-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #667eea;
            animation: typing 1.4s infinite;
        }

        .typing-dot:nth-child(2) {
            animation-delay: 0.2s;
        }

        .typing-dot:nth-child(3) {
            animation-delay: 0.4s;
        }

        @keyframes typing {
            0%, 60%, 100% {
                opacity: 0.3;
                transform: translateY(0);
            }
            30% {
                opacity: 1;
                transform: translateY(-10px);
            }
        }

        /* Stats */
        .stats {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 15px;
            margin-bottom: 20px;
        }

        .stat-item {
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
            padding: 15px;
            border-radius: 10px;
            text-align: center;
        }

        .stat-number {
            font-size: 24px;
            font-weight: bold;
            display: block;
        }

        .stat-label {
            font-size: 12px;
            opacity: 0.9;
        }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useRef, useEffect } = React;

        // Tema verileri
        const topics = {
            A2: [
                { id: 1, title: 'Günlük Rutinler', emoji: '☀️' },
                { id: 2, title: 'Yemek ve İçecek', emoji: '🍽️' },
                { id: 3, title: 'Alışveriş', emoji: '🛒' },
                { id: 4, title: 'Aile', emoji: '👨‍👩‍👧‍👦' },
            ],
            B1: [
                { id: 5, title: 'Seyahat Planlaması', emoji: '✈️' },
                { id: 6, title: 'İş ve Kariyer', emoji: '💼' },
                { id: 7, title: 'Sağlık ve Spor', emoji: '🏃' },
                { id: 8, title: 'Kültür ve Sanat', emoji: '🎭' },
            ],
            B2: [
                { id: 9, title: 'Sosyal Meseleler', emoji: '🌍' },
                { id: 10, title: 'Teknoloji ve İnnovation', emoji: '💻' },
                { id: 11, title: 'Eğitim Sistemleri', emoji: '📚' },
                { id: 12, title: 'Çevre ve Sürdürülebilirlik', emoji: '🌱' },
            ],
            C1: [
                { id: 13, title: 'Felsefe ve Etik', emoji: '🤔' },
                { id: 14, title: 'Ekonomi ve Politika', emoji: '📊' },
                { id: 15, title: 'Edebiyat ve Kritiği', emoji: '📖' },
                { id: 16, title: 'Küresel Çatışmalar', emoji: '⚖️' },
            ],
        };

        // Örnek konuşmalar
        const sampleConversations = {
            1: {
                title: 'Günlük Rutinler',
                prompts: [
                    'Sabah saat kaçta kalkıyorsun?',
                    'İş günün nasıl geçti?',
                    'Akşamları ne yaparsın?',
                ]
            },
            2: {
                title: 'Yemek ve İçecek',
                prompts: [
                    'Favori yemeğin nedir?',
                    'Bugün ne yemek istiyorsun?',
                    'En iyi restoran hangisi?',
                ]
            },
            5: {
                title: 'Seyahat Planlaması',
                prompts: [
                    'En son nereye seyahat ettin?',
                    'İstediğin destinasyon neresi?',
                    'Seyahatlerde neyi en çok seviyorsun?',
                ]
            },
            9: {
                title: 'Sosyal Meseleler',
                prompts: [
                    'Sosyal medya hakkında ne düşünüyorsun?',
                    'Gençliğin karşı karşıya olduğu zorluklar nelerdir?',
                    'İklim değişikliğine karşı neler yapmalıyız?',
                ]
            },
            13: {
                title: 'Felsefe ve Etik',
                prompts: [
                    'Mutluluk nedir sizce?',
                    'Ahlaki sorumluluk konusunda ne düşünüyorsun?',
                    'İnsan doğası hakkında düşünceleriniz nelerdir?',
                ]
            },
        };

        function App() {
            const [level, setLevel] = useState('A2');
            const [selectedTopic, setSelectedTopic] = useState(1);
            const [messages, setMessages] = useState([]);
            const [input, setInput] = useState('');
            const [loading, setLoading] = useState(false);
            const [errors, setErrors] = useState([]);
            const [tips, setTips] = useState([]);
            const messagesEndRef = useRef(null);

            const scrollToBottom = () => {
                messagesEndRef.current?.scrollIntoView({ behavior: 'smooth' });
            };

            useEffect(() => {
                scrollToBottom();
            }, [messages]);

            // Yapay grammatik analizi
            const analyzeGrammar = (text) => {
                const errorsList = [];
                const tipsList = [];

                // Basit hata kontrolleri
                if (text.length < 5) {
                    tipsList.push('💡 Daha uzun bir cümle oluşturmaya çalış!');
                }

                if (text.endsWith(' ')) {
                    errorsList.push('❌ Cümlenin sonunda gereksiz boşluk var');
                }

                if (!text.match(/[.!?]$/)) {
                    errorsList.push('⚠️ Cümlenin sonunda noktalama işareti eksik');
                }

                // Türkçe yazım kontrolleri
                if (text.match(/aa|ıı|ii|uu|öö|üü/)) {
                    errorsList.push('❌ Ardışık ünlüler yazım hatasına neden olabilir');
                }

                if (!text.match(/[A-Za-z]/)) {
                    tipsList.push('✅ Türkçe yazım gayet güzel!');
                } else if (text.match(/[A-Z]{2,}/)) {
                    tipsList.push('💡 Türkçe metin içinde çok fazla büyük harf kullanılmıyor');
                }

                if (text.length > 100) {
                    tipsList.push('✨ Harika! Uzun ve anlamlı bir cümle kurdun');
                }

                return { errors: errorsList, tips: tipsList };
            };

            // Yapay yanıt oluştur
            const generateResponse = (userText) => {
                const responses = {
                    A2: [
                        'Güzel! Şimdi detay ekleyerek cümleyi daha uzun yap.',
                        'Doğru! Bu tema hakkında başka ne söyleyebilirsin?',
                        'Harika! Neden bunu düşünüyorsun?',
                    ],
                    B1: [
                        'İyi bir noktaya değindin. Bunu açıklamak için örnekler verebilir misin?',
                        'Düşüncen için teşekkürler. Başka perspektif var mı?',
                        'Biraz daha derine inmek istersen nasıl açıklarsın?',
                    ],
                    B2: [
                        'Analitik bir yaklaşım gözlemledim. Bunun gerekçeleri nelerdir?',
                        'İlginç bir bakış açısı. Alternatif görüşler nasıl olabilir?',
                        'Sesin akademik tondu. Sosyal bağlamda bunu nasıl açıklarsın?',
                    ],
                    C1: [
                        'Sofistike bir argüman sundum. Bunun epistemolojik temelleri nelerdir?',
                        'Diyalektik yapıyı gözledim. Antinomic yapılar konusunda ne düşünüyorsun?',
                        'Normatif pozisyon alıdın. İstisnai durumlar için bunun geçerliliği var mı?',
                    ],
                };

                const levelResponses = responses[level];
                return levelResponses[Math.floor(Math.random() * levelResponses.length)];
            };

            const handleSendMessage = () => {
                if (!input.trim()) return;

                // Kullanıcı mesajını ekle
                const userMessage = {
                    id: Date.now(),
                    type: 'user',
                    text: input,
                    timestamp: new Date().toLocaleTimeString('tr-TR', { hour: '2-digit', minute: '2-digit' }),
                };

                setMessages([...messages, userMessage]);

                // Analiz et
                const { errors: newErrors, tips: newTips } = analyzeGrammar(input);
                setErrors(newErrors);
                setTips(newTips);

                setInput('');
                setLoading(true);

                // Yapay yanıt oluştur (simüle)
                setTimeout(() => {
                    const assistantMessage = {
                        id: Date.now() + 1,
                        type: 'assistant',
                        text: generateResponse(input),
                        timestamp: new Date().toLocaleTimeString('tr-TR', { hour: '2-digit', minute: '2-digit' }),
                    };

                    setMessages(prev => [...prev, assistantMessage]);
                    setLoading(false);
                }, 800);
            };

            const handleNewChat = () => {
                setMessages([]);
                setErrors([]);
                setTips([]);
                setInput('');
            };

            const currentTopic = topics[level].find(t => t.id === selectedTopic);
            const topicData = sampleConversations[selectedTopic];

            return (
                <div className="container">
                    <header>
                        <div>
                            <div className="header-title">🎯 Türkçe Konuşma Antrenörü</div>
                            <div className="header-subtitle">Kendi hızında Türkçe konuşmayı geliştir</div>
                        </div>
                        <span className="level-badge">Seviye: {level}</span>
                    </header>

                    <div className="main-content">
                        {/* Sol Panel - Seviye ve Tema Seçimi */}
                        <div className="card">
                            <h2><span className="card-icon">📊</span> Seviye Seç</h2>
                            <div className="level-selector">
                                {['A2', 'B1', 'B2', 'C1'].map(lv => (
                                    <button
                                        key={lv}
                                        className={`level-btn ${level === lv ? 'active' : ''}`}
                                        onClick={() => {
                                            setLevel(lv);
                                            setSelectedTopic(topics[lv][0].id);
                                            handleNewChat();
                                        }}
                                    >
                                        {lv}
                                    </button>
                                ))}
                            </div>

                            <h2 style={{ marginTop: '25px' }}><span className="card-icon">🎬</span> Tema Seç</h2>
                            <div className="topic-grid">
                                {topics[level].map(topic => (
                                    <div
                                        key={topic.id}
                                        className={`topic-card ${selectedTopic === topic.id ? 'selected' : ''}`}
                                        onClick={() => {
                                            setSelectedTopic(topic.id);
                                            handleNewChat();
                                        }}
                                    >
                                        <span>{topic.emoji}</span>
                                        <div>{topic.title}</div>
                                    </div>
                                ))}
                            </div>

                            {topicData && (
                                <div style={{ marginTop: '20px' }}>
                                    <h3 style={{ color: '#667eea', marginBottom: '10px', fontSize: '14px' }}>Örnek Sorular:</h3>
                                    {topicData.prompts.map((prompt, idx) => (
                                        <div
                                            key={idx}
                                            style={{
                                                padding: '8px 12px',
                                                background: '#f0f0f0',
                                                borderRadius: '8px',
                                                marginBottom: '8px',
                                                fontSize: '13px',
                                                cursor: 'pointer',
                                                transition: 'all 0.3s',
                                            }}
                                            onClick={() => setInput(prompt)}
                                            onMouseEnter={(e) => e.target.style.background = '#e0e0e0'}
                                            onMouseLeave={(e) => e.target.style.background = '#f0f0f0'}
                                        >
                                            💬 {prompt}
                                        </div>
                                    ))}
                                </div>
                            )}
                        </div>

                        {/* Sağ Panel - Sohbet */}
                        <div>
                            <div className="chat-container">
                                <div className="chat-header">
                                    <div className="chat-title">
                                        <span>{currentTopic.emoji}</span>
                                        <h3>{currentTopic.title}</h3>
                                    </div>
                                </div>

                                <div className="messages">
                                    {messages.length === 0 ? (
                                        <div className="empty-state">
                                            <div style={{ fontSize: '40px', marginBottom: '10px' }}>👋</div>
                                            <div>Bir soru sorayım başlamak için!</div>
                                            <div style={{ fontSize: '12px', marginTop: '10px', color: '#ccc' }}>
                                                Örnek sorulardan seçebilir veya kendi cümleni yazabilirsin
                                            </div>
                                        </div>
                                    ) : (
                                        messages.map(msg => (
                                            <div key={msg.id} style={{ display: 'flex', justifyContent: msg.type === 'user' ? 'flex-end' : 'flex-start', marginBottom: '15px' }}>
                                                <div>
                                                    <div className={`message ${msg.type}`}>
                                                        {msg.text}
                                                        <div className="message-meta">{msg.timestamp}</div>
                                                        {msg.type === 'user' && errors.length > 0 && (
                                                            <div className="feedback">
                                                                {errors.map((err, i) => <div key={i}>{err}</div>)}
                                                            </div>
                                                        )}
                                                    </div>
                                                </div>
                                            </div>
                                        ))
                                    )}

                                    {loading && (
                                        <div style={{ display: 'flex', alignItems: 'center', gap: '10px' }}>
                                            <div className="typing-indicator">
                                                <div className="typing-dot"></div>
                                                <div className="typing-dot"></div>
                                                <div className="typing-dot"></div>
                                            </div>
                                        </div>
                                    )}

                                    <div ref={messagesEndRef} />
                                </div>

                                <div className="input-area">
                                    <input
                                        type="text"
                                        className="input-field"
                                        placeholder="Türkçe yazarak pratik yap..."
                                        value={input}
                                        onChange={(e) => setInput(e.target.value)}
                                        onKeyPress={(e) => e.key === 'Enter' && handleSendMessage()}
                                    />
                                    <button className="send-btn" onClick={handleSendMessage}>
                                        📤 Gönder
                                    </button>
                                </div>

                                {messages.length > 0 && (
                                    <button className="new-chat-btn" onClick={handleNewChat}>
                                        ↻ Yeni Sohbet Başlat
                                    </button>
                                )}
                            </div>
                        </div>
                    </div>

                    {/* Geri Bildirim Bölümü */}
                    {messages.length > 0 && (
                        <div className="feedback-section">
                            <div className="feedback-card">
                                <h3><span>✍️</span> Yazım Hataları</h3>
                                {errors.length > 0 ? (
                                    errors.map((err, idx) => <div key={idx} className="error-item">{err}</div>)
                                ) : (
                                    <div className="empty-state" style={{ padding: '10px' }}>Hata yok! ✨</div>
                                )}
                            </div>

                            <div className="feedback-card">
                                <h3><span>💡</span> İpuçları</h3>
                                {tips.length > 0 ? (
                                    tips.map((tip, idx) => <div key={idx} className="tip-item">{tip}</div>)
                                ) : (
                                    <div className="empty-state" style={{ padding: '10px' }}>Harika çalışıyor! 🎉</div>
                                )}
                            </div>
                        </div>
                    )}
                </div>
            );
        }

        ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>
</body>
</html>
